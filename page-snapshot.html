            var $element = $(this).closest(".drawer-item, [drawer-parent]");
            var clickCount = $element.data("clickCount") || 0;

              $element.removeClass("open");

            } else {
              $element.siblings().removeClass("open").data("clickCount", 0);
              $element.addClass("open");
              setTimeout(function () { ScrollTrigger.refresh(); }, 600);
            }
            clickCount++;
            if (clickCount > 1) clickCount = 0;
            $element.data("clickCount", clickCount);
          });

          // Swiper
          $(".swiper").each(function () {
            let $swiper = $(this);
            let prev = $swiper.find(".is-prev")[0];
            let next = $swiper.find(".is-next")[0];
            let nav = $swiper.find(".swiper-pagination")[0];

                next = next || $wrap.find(".is-next")[0];

              speed: speed,
              loop: loop,

              navigation: { nextEl: next, prevEl: prev },
              pagination: { el: nav, clickable: true },
            });

        setTimeout(() => { try { ScrollTrigger.refresh(); } catch (e) {} }, 100);

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>

<script>
// Initialize floating ball functionality
function initFloatingBall() {
  const ball = document.getElementById('minimax-floating-ball');
  if (!ball) return;

  // Initial animation
  ball.style.opacity = '0';
  ball.style.transform = 'translateY(20px)';

  setTimeout(() => {
    ball.style.opacity = '1';
    ball.style.transform = 'translateY(0)';
  }, 500);

  // Handle logo click
  const ballContent = ball.querySelector('.minimax-ball-content');
  ballContent.addEventListener('click', function (e) {
    e.stopPropagation();
    window.open('https://agent.minimax.io/', '_blank');
    ball.style.transform = 'scale(0.95)';
    setTimeout(() => {
      ball.style.transform = 'scale(1)';
    }, 100);
  });

  // Handle close button click
  const closeIcon = ball.querySelector('.minimax-close-icon');
  closeIcon.addEventListener('click', function (e) {
    e.stopPropagation();
    ball.style.opacity = '0';
    ball.style.transform = 'translateY(20px)';

    setTimeout(() => {
      ball.style.display = 'none';
    }, 300);
  });
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', initFloatingBall); 
</script>
