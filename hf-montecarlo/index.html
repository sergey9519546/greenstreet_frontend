<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("fonts/Outfit.woff2") format("woff2"); font-weight: 400 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 600 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #004041; }
      body { font-family: "Outfit", sans-serif; letter-spacing: -0.02em; color: #eeefd3; }
      .mono { font-family: "JetBrains Mono", monospace; }
      #stage { position: absolute; inset: 0; }

      /* subtle dot texture */
      .dotgrid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.045) 1.5px, transparent 1.5px); background-size: 46px 46px; }

      /* wordmark */
      #wordmark { position: absolute; left: 160px; top: 88px; font-size: 40px; font-weight: 600; letter-spacing: -0.04em; color: #eeefd3; }

      /* ── Scene A: title ── */
      #titleBlock { position: absolute; left: 160px; top: 260px; }
      #titleLine1 { font-size: 106px; font-weight: 600; line-height: 0.94; letter-spacing: -0.04em; color: #eeefd3; }
      #titleLine2 { font-size: 106px; font-weight: 600; line-height: 0.94; letter-spacing: -0.04em; color: #d8d958; }
      #titleSub   { font-size: 34px; font-weight: 500; color: rgba(238,239,211,0.60); margin-top: 30px; letter-spacing: -0.02em; }

      /* ── Scene B+C+D: viz frame ── */
      #vizFrame { position: absolute; left: 160px; top: 88px; right: 160px; bottom: 88px; }
      #vizLabel { position: absolute; left: 0; top: 8px; }
      #vizLabelK { font-size: 17px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #d8d958; }
      #vizLabelH { font-size: 50px; font-weight: 600; letter-spacing: -0.03em; margin-top: 8px; color: #eeefd3; }

      #svgWrap { position: absolute; left: 0; right: 0; top: 148px; bottom: 0; }
      #svgWrap svg { width: 100%; height: 100%; display: block; }

      /* fill paths — none */
      .rpath { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* ── Scene D: badge ── */
      #badge { position: absolute; right: 0; bottom: 60px; }
      #badgeInner { background: #003130; border: 2px solid #4dbd97; border-radius: 16px; padding: 30px 48px; display: inline-block; }
      #badgeLabel { font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(238,239,211,0.55); margin-bottom: 10px; }
      #badgeValue { font-family: "JetBrains Mono", monospace; font-size: 72px; font-weight: 700; color: #4dbd97; letter-spacing: -0.03em; line-height: 1; }

      /* ── Scene E: end card ── */
      #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #004041; }
      #endH   { font-size: 92px; font-weight: 600; text-align: center; line-height: 1.0; letter-spacing: -0.04em; max-width: 20ch; }
      #endH em { color: #d8d958; font-style: normal; }
      #endSub { font-size: 36px; font-weight: 500; color: rgba(238,239,211,0.62); margin-top: 28px; letter-spacing: -0.02em; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="9"
         data-width="1920"
         data-height="1080"
         style="position:relative;width:1920px;height:1080px;overflow:hidden">

      <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <div class="dotgrid"></div>

        <!-- wordmark (shown through B/C/D) -->
        <div id="wordmark">Greenstreet</div>

        <!-- ── A: Title ── -->
        <div id="titleBlock">
          <div id="titleLine1">Stress-test the deal</div>
          <div id="titleLine2">over 500 futures.</div>
          <div id="titleSub">Monte Carlo · Vasicek SOFR · Greenstreet</div>
        </div>

        <!-- ── B / C / D: Viz ── -->
        <div id="vizFrame">
          <div id="vizLabel">
            <div id="vizLabelK">SOFR Rate Paths · 500 simulations · 10yr horizon</div>
            <div id="vizLabelH">Where does your DSCR break?</div>
          </div>

          <div id="svgWrap">
            <!--
              SVG fan: 24 deterministic SOFR path polylines fanning from x=0,y=500 (~4.2% SOFR).
              Viewbox 1560×660. y-axis: 660=2%, 500=4.2%, 300=6.5%, 120=8.5%.
              All points precomputed as fixed arrays — no Math.random().
            -->
            <svg id="fanSvg" viewBox="0 0 1560 660" preserveAspectRatio="none">

              <!-- grid lines -->
              <line x1="40" y1="560" x2="1560" y2="560" stroke="rgba(238,239,211,0.10)" stroke-width="1.2"/>
              <line x1="40" y1="400" x2="1560" y2="400" stroke="rgba(238,239,211,0.07)" stroke-width="1"/>
              <line x1="40" y1="240" x2="1560" y2="240" stroke="rgba(238,239,211,0.07)" stroke-width="1"/>
              <line x1="40" y1="120" x2="1560" y2="120" stroke="rgba(238,239,211,0.05)" stroke-width="1"/>

              <!-- y-axis labels -->
              <text x="0" y="564" fill="rgba(238,239,211,0.35)" font-size="18" font-family="JetBrains Mono,monospace">3%</text>
              <text x="0" y="404" fill="rgba(238,239,211,0.35)" font-size="18" font-family="JetBrains Mono,monospace">5%</text>
              <text x="0" y="244" fill="rgba(238,239,211,0.35)" font-size="18" font-family="JetBrains Mono,monospace">7%</text>

              <!-- P10–P90 shaded band — traces the outer envelope of middle 80% of paths -->
              <polygon id="pctBand"
                points="0,500 260,490 520,476 780,464 1040,456 1300,450 1560,446
                        1560,360 1300,356 1040,348 780,336 520,322 260,306 0,310"
                fill="#4dbd97" opacity="0"/>

              <!--
                GROUP A — upward drift (7 paths, emerald)
                All start at y=500 and drift upward (lower y = higher SOFR rate).
              -->
              <polyline id="rp0"  class="rpath" stroke="#4dbd97" stroke-width="2.6" stroke-opacity="0.88"
                points="0,500 130,484 260,466 390,444 520,428 650,410 780,394 910,376 1040,358 1300,328 1560,308"/>
              <polyline id="rp1"  class="rpath" stroke="#4dbd97" stroke-width="2.1" stroke-opacity="0.70"
                points="0,500 130,487 260,471 390,452 520,438 650,422 780,408 910,392 1040,378 1300,350 1560,332"/>
              <polyline id="rp2"  class="rpath" stroke="#4dbd97" stroke-width="1.7" stroke-opacity="0.54"
                points="0,500 130,490 260,477 390,462 520,448 650,434 780,422 910,408 1040,394 1300,368 1560,350"/>
              <polyline id="rp3"  class="rpath" stroke="#4dbd97" stroke-width="1.4" stroke-opacity="0.42"
                points="0,500 130,492 260,481 390,468 520,455 650,443 780,432 910,420 1040,408 1300,384 1560,366"/>
              <polyline id="rp4"  class="rpath" stroke="#4dbd97" stroke-width="1.2" stroke-opacity="0.34"
                points="0,500 130,494 260,484 390,472 520,460 650,450 780,440 910,430 1040,420 1300,400 1560,384"/>
              <polyline id="rp5"  class="rpath" stroke="#4dbd97" stroke-width="1.1" stroke-opacity="0.27"
                points="0,500 130,488 260,473 390,455 520,437 650,420 780,402 910,384 1040,366 1300,336 1560,314"/>
              <polyline id="rp6"  class="rpath" stroke="#4dbd97" stroke-width="1.0" stroke-opacity="0.20"
                points="0,500 130,483 260,463 390,438 520,412 650,388 780,364 910,340 1040,316 1300,282 1560,258"/>

              <!--
                GROUP B — mean-reverting / flat (6 paths, lemon)
              -->
              <polyline id="rp7"  class="rpath" stroke="#d8d958" stroke-width="2.2" stroke-opacity="0.78"
                points="0,500 130,499 260,496 390,493 520,490 650,487 780,485 910,483 1040,481 1300,478 1560,476"/>
              <polyline id="rp8"  class="rpath" stroke="#d8d958" stroke-width="1.8" stroke-opacity="0.62"
                points="0,500 130,500 260,498 390,497 520,495 650,494 780,493 910,492 1040,491 1300,490 1560,489"/>
              <polyline id="rp9"  class="rpath" stroke="#d8d958" stroke-width="1.5" stroke-opacity="0.48"
                points="0,500 130,502 260,502 390,502 520,502 650,502 780,503 910,503 1040,503 1300,503 1560,503"/>
              <polyline id="rp10" class="rpath" stroke="#d8d958" stroke-width="1.3" stroke-opacity="0.38"
                points="0,500 130,503 260,505 390,506 520,507 650,508 780,509 910,510 1040,511 1300,512 1560,513"/>
              <polyline id="rp11" class="rpath" stroke="#d8d958" stroke-width="1.1" stroke-opacity="0.30"
                points="0,500 130,505 260,508 390,511 520,514 650,517 780,520 910,522 1040,524 1300,527 1560,530"/>
              <polyline id="rp12" class="rpath" stroke="#d8d958" stroke-width="1.0" stroke-opacity="0.22"
                points="0,500 130,507 260,513 390,518 520,523 650,528 780,533 910,537 1040,540 1300,545 1560,549"/>

              <!--
                GROUP C — mild downward drift / low-rate (5 paths, cream)
              -->
              <polyline id="rp13" class="rpath" stroke="#eeefd3" stroke-width="1.8" stroke-opacity="0.44"
                points="0,500 130,508 260,518 390,530 520,543 650,556 780,567 910,578 1040,587 1300,600 1560,610"/>
              <polyline id="rp14" class="rpath" stroke="#eeefd3" stroke-width="1.5" stroke-opacity="0.34"
                points="0,500 130,510 260,522 390,537 520,552 650,567 780,581 910,593 1040,604 1300,620 1560,631"/>
              <polyline id="rp15" class="rpath" stroke="#eeefd3" stroke-width="1.2" stroke-opacity="0.26"
                points="0,500 130,512 260,527 390,544 520,562 650,580 780,596 910,610 1040,622 1300,638 1560,649"/>
              <polyline id="rp16" class="rpath" stroke="#eeefd3" stroke-width="1.0" stroke-opacity="0.20"
                points="0,500 130,514 260,532 390,552 520,573 650,594 780,613 910,629 1040,644 1300,658 1560,666"/>
              <polyline id="rp17" class="rpath" stroke="#eeefd3" stroke-width="0.9" stroke-opacity="0.14"
                points="0,500 130,516 260,537 390,560 520,585 650,609 780,630 910,648 1040,659 1300,668 1560,672"/>

              <!--
                GROUP D — stress / high-rate outliers (6 paths, red)
              -->
              <polyline id="rp18" class="rpath" stroke="#ff6b6b" stroke-width="2.0" stroke-opacity="0.74"
                points="0,500 130,480 260,456 390,428 520,400 650,372 780,344 910,318 1040,293 1300,256 1560,228"/>
              <polyline id="rp19" class="rpath" stroke="#ff6b6b" stroke-width="1.6" stroke-opacity="0.57"
                points="0,500 130,482 260,460 390,434 520,408 650,382 780,356 910,332 1040,308 1300,274 1560,248"/>
              <polyline id="rp20" class="rpath" stroke="#ff6b6b" stroke-width="1.4" stroke-opacity="0.44"
                points="0,500 130,484 260,464 390,441 520,418 650,395 780,372 910,350 1040,330 1300,298 1560,274"/>
              <polyline id="rp21" class="rpath" stroke="#ff6b6b" stroke-width="1.2" stroke-opacity="0.34"
                points="0,500 130,486 260,468 390,447 520,426 650,406 780,386 910,366 1040,348 1300,318 1560,296"/>
              <polyline id="rp22" class="rpath" stroke="#ff6b6b" stroke-width="1.1" stroke-opacity="0.26"
                points="0,500 130,488 260,472 390,453 520,434 650,416 780,398 910,381 1040,366 1300,340 1560,320"/>
              <polyline id="rp23" class="rpath" stroke="#ff6b6b" stroke-width="1.0" stroke-opacity="0.19"
                points="0,500 130,490 260,476 390,459 520,442 650,426 780,410 910,396 1040,382 1300,360 1560,342"/>

              <!-- origin dot -->
              <circle cx="0" cy="500" r="7" fill="#eeefd3"/>
              <text x="14" y="496" fill="rgba(238,239,211,0.72)" font-size="20" font-family="JetBrains Mono,monospace">r₀ = 4.18%</text>

              <!-- legend -->
              <rect x="1240" y="30" width="16" height="16" rx="3" fill="#4dbd97"/>
              <text x="1264" y="44" fill="rgba(238,239,211,0.65)" font-size="18" font-family="JetBrains Mono,monospace">Rising</text>
              <rect x="1340" y="30" width="16" height="16" rx="3" fill="#d8d958"/>
              <text x="1364" y="44" fill="rgba(238,239,211,0.65)" font-size="18" font-family="JetBrains Mono,monospace">Stable</text>
              <rect x="1450" y="30" width="16" height="16" rx="3" fill="#ff6b6b"/>
              <text x="1474" y="44" fill="rgba(238,239,211,0.65)" font-size="18" font-family="JetBrains Mono,monospace">Stress</text>
            </svg>
          </div>

          <!-- D: badge -->
          <div id="badge">
            <div id="badgeInner">
              <div id="badgeLabel">P(DSCR &lt; 1.0)</div>
              <div id="badgeValue">12%</div>
            </div>
          </div>
        </div>

        <!-- ── E: End card ── -->
        <div id="end">
          <div id="endH">500 paths.<br/><em>One clear answer.</em></div>
          <div id="endSub">— Greenstreet</div>
        </div>

      </div><!-- #stage -->
    </div><!-- #root -->

    <script>
      // ── Pre-compute polyline lengths for stroke-draw (deterministic, no Math.random) ──
      var paths = document.querySelectorAll(".rpath");
      var pathLengths = [];
      paths.forEach(function(p) {
        var raw = p.getAttribute("points").trim().split(/[\s,]+/);
        var pts = [];
        for (var k = 0; k + 1 < raw.length; k += 2) {
          pts.push({ x: parseFloat(raw[k]), y: parseFloat(raw[k + 1]) });
        }
        var len = 0;
        for (var j = 1; j < pts.length; j++) {
          var dx = pts[j].x - pts[j-1].x, dy = pts[j].y - pts[j-1].y;
          len += Math.sqrt(dx * dx + dy * dy);
        }
        pathLengths.push(len);
        p.style.strokeDasharray  = String(len);
        p.style.strokeDashoffset = String(len); // start hidden
      });

      // ── GSAP paused timeline ──────────────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // initial states (set synchronously before timeline runs)
      gsap.set("#wordmark",   { opacity: 0 });
      gsap.set("#titleBlock", { opacity: 0, y: 44 });
      gsap.set("#vizFrame",   { opacity: 0 });
      gsap.set("#pctBand",    { opacity: 0 });
      gsap.set("#badge",      { opacity: 0, x: 44 });
      gsap.set("#end",        { opacity: 0 });

      // ── A: Title scene (0 → 2.0s) ──
      tl.to("#wordmark",   { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.to("#titleBlock", { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.25);
      // hold, then exit
      tl.to("#titleBlock", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 1.85);

      // ── B: Viz frame fades in (2.1s) ──
      tl.to("#vizFrame", { opacity: 1, duration: 0.55, ease: "power2.out" }, 2.1);

      // ── B: Stroke-draw 24 paths with stagger (2.3 → ~6.1s) ──
      paths.forEach(function(p, i) {
        var len = pathLengths[i];
        tl.fromTo(p,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 1.55, ease: "power2.out" },
          2.3 + i * 0.10
        );
      });

      // ── C: Percentile band (p10-p90) fades in (4.9s) ──
      tl.to("#pctBand", { opacity: 0.13, duration: 0.75, ease: "power2.out" }, 4.9);

      // ── D: Probability badge slides in (5.8s) ──
      tl.to("#badge", { opacity: 1, x: 0, duration: 0.65, ease: "back.out(1.4)" }, 5.8);

      // exit viz (7.3s)
      tl.to(["#vizFrame", "#wordmark"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 7.3);

      // ── E: End card (7.55s → 9s) ──
      tl.to("#end",    { opacity: 1, duration: 0.6, ease: "power2.out" }, 7.55);
      tl.from("#endH",   { y: 38, opacity: 0, duration: 0.75, ease: "power3.out" }, 7.7);
      tl.from("#endSub", { y: 22, opacity: 0, duration: 0.65, ease: "power3.out" }, 8.05);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
