<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/vendor/gsap.min.js"></script>
    <style>
      :root{
        --ink:#eeefd3;            /* cream — primary text (matches the card label next to it) */
        --ink-soft:rgba(238,239,211,0.56);
        --ink-faint:rgba(238,239,211,0.13);
        --panel:#003a39;          /* dark instrument panel */
        --panel-2:#00302f;
        --line:rgba(238,239,211,0.10);
        --lemon:#d8d958;
        --emerald:#4dbd97;
        --teal:#53bdb9;
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      html,body{width:100%;height:100%;overflow:hidden;background:transparent;
        color:var(--ink);font-family:"Outfit Variable","Outfit","Inter",Arial,sans-serif;
        font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
      #root{position:relative;width:100vw;height:100vh;overflow:hidden;background:transparent;}

      /* ── card ── */
      .hf-card{position:absolute;inset:0;overflow:hidden;border-radius:8px;
        background:var(--panel);color:var(--ink);}
      .hf-card::before{content:"";position:absolute;inset:0;pointer-events:none;
        background-image:radial-gradient(rgba(238,239,211,0.05) 1px,transparent 1px);
        background-size:38px 38px;opacity:.8;}

      /* ── header: wordmark + step label (SAME cream color) ── */
      .hf-head{position:absolute;left:5.5%;right:5.5%;top:7%;display:flex;
        align-items:center;justify-content:space-between;}
      .hf-brand{font-size:clamp(13px,2.4vw,21px);font-weight:600;letter-spacing:-0.03em;color:var(--ink);}
      .hf-step{font-size:clamp(9px,1.7vw,13px);font-weight:700;letter-spacing:0.12em;
        text-transform:uppercase;color:var(--ink-soft);}

      .hf-stage{position:absolute;left:5.5%;right:5.5%;top:19%;bottom:13%;}

      .hf-panel,.hf-row,.hf-pill,.hf-card-el,.hf-ticket{position:absolute;}
      .hf-panel,.hf-row,.hf-card-el,.hf-ticket{
        background:var(--panel-2);border:1px solid var(--line);border-radius:10px;}

      .hf-small{font-size:clamp(9px,1.8vw,13px);font-weight:600;color:var(--ink-soft);
        letter-spacing:0;text-transform:uppercase;}
      .hf-label{font-size:clamp(12px,2.3vw,18px);font-weight:600;color:var(--ink);letter-spacing:-0.02em;}
      .hf-line{display:block;height:7px;border-radius:999px;background:var(--ink-faint);}
      .hf-line.is-short{width:42%;} .hf-line.is-mid{width:64%;} .hf-line.is-long{width:84%;}

      .hf-chip{display:inline-flex;align-items:center;justify-content:center;min-height:24px;
        padding:0 13px;border-radius:999px;background:var(--lemon);color:#003232;
        font-size:clamp(10px,2.2vw,15px);font-weight:700;letter-spacing:-0.01em;}
      .hf-chip.is-teal{background:var(--teal);color:#003232;}
      .hf-chip.is-ghost{background:rgba(238,239,211,0.08);color:var(--ink-soft);}

      .hf-metric{display:block;color:var(--lemon);font-weight:700;letter-spacing:-0.05em;
        font-size:clamp(30px,11vw,72px);line-height:1;}

      .hf-scan{position:absolute;top:0;bottom:0;left:-26%;width:20%;
        background:linear-gradient(90deg,transparent,rgba(238,239,211,0.10),transparent);
        transform:skewX(-10deg);pointer-events:none;}
      .hf-cursor{position:absolute;width:18px;height:18px;border-radius:50%;
        background:var(--teal);box-shadow:0 0 0 7px rgba(83,189,185,0.18);}
      .hf-progress{position:absolute;left:5.5%;right:5.5%;bottom:7.5%;height:6px;border-radius:999px;
        background:rgba(238,239,211,0.10);overflow:hidden;}
      .hf-progress-fill{display:block;width:100%;height:100%;border-radius:inherit;
        background:var(--lemon);transform-origin:left center;}

      /* ── scene 1 — calculator ── */
      .scene-1 .calc{left:0;top:4%;width:54%;height:78%;padding:5%;}
      .scene-1 .hf-field{height:22%;margin-bottom:7%;padding:0 6%;border-radius:8px;
        background:rgba(238,239,211,0.05);border:1px solid var(--line);
        display:flex;flex-direction:column;justify-content:center;gap:6px;}
      .scene-1 .hf-field b{font-size:clamp(12px,2.6vw,19px);font-weight:600;color:var(--ink);letter-spacing:-0.02em;}
      .scene-1 .result{right:0;top:9%;width:39%;height:66%;padding:6%;
        display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:9px;}
      .scene-1 .pitia{position:absolute;left:0;right:0;bottom:0;height:8px;border-radius:999px;display:flex;gap:3px;overflow:hidden;}
      .scene-1 .pitia i{display:block;height:100%;}

      /* ── scene 2 — lenders ── */
      .scene-2 .hf-row{left:0;right:0;height:27%;padding:0 5%;display:grid;
        grid-template-columns:12% 1fr 20%;gap:5%;align-items:center;}
      .scene-2 .row-1{top:2%;border-color:rgba(216,217,88,0.5);} .scene-2 .row-2{top:36.5%;} .scene-2 .row-3{top:71%;}
      .scene-2 .hf-rank{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;
        background:rgba(238,239,211,0.07);color:var(--ink);font-weight:700;font-size:clamp(12px,3vw,20px);}
      .scene-2 .row-1 .hf-rank{background:var(--lemon);color:#003232;}

      /* ── scene 3 — quiz / grade gauge ── */
      .scene-3 .hf-pill{min-width:30%;height:25%;border-radius:10px;background:var(--panel-2);
        border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-size:clamp(11px,2.5vw,17px);font-weight:600;color:var(--ink);}
      .scene-3 .pill-1{left:0;top:4%;} .scene-3 .pill-2{right:0;top:4%;background:rgba(83,189,185,0.16);border-color:rgba(83,189,185,0.4);}
      .scene-3 .pill-3{left:0;bottom:6%;} .scene-3 .pill-4{right:0;bottom:6%;background:rgba(77,189,151,0.15);border-color:rgba(77,189,151,0.4);}
      .scene-3 .gauge{position:absolute;left:34%;top:30%;width:32%;aspect-ratio:1;border-radius:50%;
        display:grid;place-items:center;background:conic-gradient(var(--lemon) 0 78%,rgba(238,239,211,0.10) 78% 100%);}
      .scene-3 .gauge::after{content:"";position:absolute;inset:14%;border-radius:50%;background:var(--panel);}
      .scene-3 .gauge b{position:relative;z-index:1;font-size:clamp(22px,7vw,46px);font-weight:700;color:var(--ink);letter-spacing:-0.04em;}

      /* ── scene 4 — state rules ── */
      .scene-4 .grid{left:0;top:0;width:52%;height:84%;display:grid;grid-template-columns:repeat(6,1fr);
        gap:7%;padding:5%;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);}
      .scene-4 .hf-state{display:block;border-radius:4px;background:rgba(238,239,211,0.08);}
      .scene-4 .hf-state.is-hot{background:var(--teal);}
      .scene-4 .hf-state.is-flag{background:var(--lemon);}
      .scene-4 .rule{right:0;width:42%;height:23%;padding:4.5%;display:flex;align-items:center;gap:9px;}
      .scene-4 .rule-1{top:3%;} .scene-4 .rule-2{top:38.5%;} .scene-4 .rule-3{top:74%;}

      /* ── scene 5 — rate lock ── */
      .scene-5 .doc{left:4%;top:6%;width:34%;height:62%;border-radius:9px;background:rgba(238,239,211,0.06);
        border:1px solid var(--line);padding:6%;display:flex;flex-direction:column;gap:9%;}
      .scene-5 .ticket{right:3%;top:2%;width:46%;height:84%;padding:7%;display:flex;flex-direction:column;
        justify-content:center;gap:11px;background:var(--panel-2);border:1px solid rgba(216,217,88,0.45);}
      .scene-5 .lockdot{position:absolute;right:9%;top:10%;width:9%;aspect-ratio:1;border-radius:50%;
        background:var(--emerald);box-shadow:0 0 0 6px rgba(77,189,151,0.18);}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="step-scene" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="scene"></div>
    </div>

    <script>
      const step = Math.min(5, Math.max(1, Number(new URLSearchParams(window.location.search).get("step")) || 1));
      const LABELS = ["Run the numbers", "Match lenders", "Rate quiz", "State rules", "Lock the rate"];

      const stages = [
        /* 1 — calculator */
        '<div class="hf-stage">' +
          '<div class="hf-panel calc hf-layer">' +
            '<div class="hf-field hf-layer"><span class="hf-small">Purchase price</span><b>$425,000</b></div>' +
            '<div class="hf-field hf-layer"><span class="hf-small">Monthly rent</span><b>$3,000</b></div>' +
            '<div class="hf-field hf-layer"><span class="hf-small">Note rate</span><b>7.00%</b></div>' +
          '</div>' +
          '<div class="hf-panel result hf-layer hf-pop">' +
            '<span class="hf-small">Track-1 DSCR</span>' +
            '<span class="hf-metric" data-count="1.11" data-suffix="x">0.00x</span>' +
            '<span class="hf-chip">Qualifies</span>' +
            '<span class="hf-small" style="margin-top:4px">PITIA $2,704/mo</span>' +
            '<span class="pitia"><i style="width:78%;background:var(--lemon)"></i><i style="width:15%;background:var(--emerald)"></i><i style="width:7%;background:var(--teal)"></i></span>' +
          '</div>' +
          '<span class="hf-cursor"></span>' +
        '</div>',
        /* 2 — lenders */
        '<div class="hf-stage">' +
          '<div class="hf-row row-1 hf-layer hf-pop"><span class="hf-rank">1</span><div><span class="hf-label">Greenstreet — Premier</span><span class="hf-line is-long" style="margin-top:7px"></span></div><span class="hf-chip">94%</span></div>' +
          '<div class="hf-row row-2 hf-layer"><span class="hf-rank">2</span><div><span class="hf-label">Greenstreet — STR Plus</span><span class="hf-line is-mid" style="margin-top:7px"></span></div><span class="hf-chip is-teal">82%</span></div>' +
          '<div class="hf-row row-3 hf-layer"><span class="hf-rank">3</span><div><span class="hf-label">Greenstreet — No-Ratio</span><span class="hf-line is-short" style="margin-top:7px"></span></div><span class="hf-chip is-ghost">68%</span></div>' +
        '</div>',
        /* 3 — quiz / grade */
        '<div class="hf-stage">' +
          '<span class="hf-pill pill-1 hf-layer">FICO 742</span>' +
          '<span class="hf-pill pill-2 hf-layer">LTV 72%</span>' +
          '<div class="gauge hf-layer hf-pop"><b>A&minus;</b></div>' +
          '<span class="hf-pill pill-3 hf-layer">SFR</span>' +
          '<span class="hf-pill pill-4 hf-layer">Lease OK</span>' +
        '</div>',
        /* 4 — state rules */
        '<div class="hf-stage">' +
          '<div class="grid hf-layer">' +
            Array.from({length:24},function(_,i){var c=[5,9,15].indexOf(i)>=0?' is-hot':([2,18].indexOf(i)>=0?' is-flag':'');return '<span class="hf-state'+c+'"></span>';}).join('') +
          '</div>' +
          '<div class="hf-panel rule rule-1 hf-layer"><span class="hf-chip">TX</span><span class="hf-label">APR clear</span></div>' +
          '<div class="hf-panel rule rule-2 hf-layer hf-pop"><span class="hf-chip is-teal">MN</span><span class="hf-label">Bill checked</span></div>' +
          '<div class="hf-panel rule rule-3 hf-layer"><span class="hf-chip is-ghost">NJ</span><span class="hf-label">LLC risk OK</span></div>' +
        '</div>',
        /* 5 — rate lock */
        '<div class="hf-stage">' +
          '<div class="doc hf-layer"><span class="hf-line is-long"></span><span class="hf-line is-mid"></span><span class="hf-line is-short"></span><span class="hf-line is-mid"></span></div>' +
          '<div class="ticket hf-layer hf-pop">' +
            '<span class="lockdot hf-layer"></span>' +
            '<span class="hf-small">Scenario saved</span>' +
            '<span class="hf-metric" data-count="6.875" data-suffix="%" data-dec="3">0.000%</span>' +
            '<span class="hf-small">30-day lock &middot; clean file</span>' +
          '</div>' +
        '</div>'
      ];

      document.getElementById("scene").innerHTML =
        '<div class="hf-card scene-' + step + '">' +
          '<div class="hf-scan"></div>' +
          '<div class="hf-head"><span class="hf-brand">Greenstreet</span><span class="hf-step">' + LABELS[step - 1] + '</span></div>' +
          stages[step - 1] +
          '<div class="hf-progress"><span class="hf-progress-fill"></span></div>' +
        '</div>';

      /* count-up helper (deterministic; driven by the paused timeline via a proxy object) */
      function bindCount(el, tl, at){
        var end = parseFloat(el.getAttribute("data-count")) || 0;
        var dec = parseInt(el.getAttribute("data-dec") || "2", 10);
        var suf = el.getAttribute("data-suffix") || "";
        var o = { n: 0 };
        tl.to(o, { n: end, duration: 0.9, ease: "power2.out",
          onUpdate: function(){ el.textContent = o.n.toFixed(dec) + suf; } }, at);
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* header (wordmark + step label) stays visible at all times — its color is
         the fix the user asked for, so it must never sit at opacity 0. */
      gsap.set(".hf-layer", { opacity: 0, y: 22, scale: 0.985, transformOrigin: "50% 60%" });
      gsap.set(".hf-progress-fill", { scaleX: 0, transformOrigin: "left center" });
      gsap.set(".hf-scan", { x: "-15%" });
      if (document.querySelector(".hf-cursor")) gsap.set(".hf-cursor", { left: "14%", top: "70%", opacity: 0 });

      tl.from(".hf-card", { opacity: 0, scale: 0.99, duration: 0.4, ease: "power2.out" }, 0);
      tl.to(".hf-layer", { opacity: 1, y: 0, scale: 1, duration: 0.55, stagger: 0.11, ease: "power3.out" }, 0.35);

      if (document.querySelector(".hf-cursor")) {
        tl.to(".hf-cursor", { opacity: 1, duration: 0.2 }, 0.7)
          .to(".hf-cursor", { left: "78%", top: "30%", scale: 0.9, duration: 1.0, ease: "power2.inOut" }, 0.8)
          .to(".hf-cursor", { opacity: 0, duration: 0.3 }, 1.9);
      }

      document.querySelectorAll("[data-count]").forEach(function(el){ bindCount(el, tl, 1.0); });

      tl.to(".hf-scan", { x: "640%", duration: 1.25, ease: "power2.inOut" }, 1.05);
      tl.to(".hf-progress-fill", { scaleX: 1, duration: 1.4, ease: "power2.out" }, 1.1);

      if (document.querySelector(".hf-pop")) {
        tl.fromTo(".hf-pop", { boxShadow: "0 0 0 0 rgba(216,217,88,0)" },
          { boxShadow: "0 0 0 3px rgba(216,217,88,0.55)", duration: 0.4, repeat: 1, yoyo: true, ease: "sine.inOut" }, 1.9);
      }
      tl.to(".hf-layer", { y: -4, duration: 1.2, stagger: 0.03, ease: "sine.inOut" }, 3.3);

      window.__timelines["step-scene"] = tl;
    </script>
  </body>
</html>
