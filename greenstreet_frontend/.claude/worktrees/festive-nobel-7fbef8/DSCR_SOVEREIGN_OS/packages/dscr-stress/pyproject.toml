[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "dscr-stress"
version = "0.6.1"
description = "Stress + distributional + conformal + R-Vine copula + ARM reset DSCR layer for DSCR Sovereign OS (Slice 2 P0-1 + P0-2 + P0-3 + P0-4)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "DSCR Sovereign OS" }
]
keywords = [
  "dscr",
  "mortgage",
  "non-qm",
  "stress-test",
  "monte-carlo",
  "distributional",
  "conformal-prediction",
  "vine-copula",
  "joint-risk",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Operating System :: OS Independent",
]

dependencies = [
  # Slice 1 foundation
  "dscr-core>=0.5.0",
  # Numerical: numpy for Monte Carlo
  "numpy>=1.26",
  # Slice 2 P0-2 conformal prediction (MAPIE)
  "mapie>=1.4.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  # Slice 2 P0-3 R-Vine Copula joint risk modeling
  # pyvinecopulib 0.7.6 (TUM Munich, MIT License) -- Python 3.11/3.12 wheel
  "pyvinecopulib>=0.7.0,<0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dscr_stress"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["UP042"]
