[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dscr-core"
version = "0.1.0"
description = "DSCR Sovereign OS — Core deterministic calculator module"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "DSCR Sovereign OS Team" },
]
keywords = ["dscr", "mortgage", "non-qm", "underwriting", "real-estate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/dscr-sovereign-os/dscr-core"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 91
