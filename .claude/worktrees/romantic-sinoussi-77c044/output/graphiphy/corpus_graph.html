        if (n.label.toLowerCase().includes(query) || n.topdir.toLowerCase().includes(query)) {
            matched.add(n.id);
            if (!n.is_topdir) matched.add("TOPDIR|" + n.topdir);
        }
    });
    node.style("opacity", n => matched.has(n.id) ? 1 : 0.15);
    label.style("opacity", n => matched.has(n.id) ? 1 : 0.1);
    link.style("opacity", e => (matched.has(e.source.id) && matched.has(e.target.id)) ? 0.8 : 0.05);
});

// Toggle topdir highlight/dim
const dimmedTopdirs = new Set();
function toggleTopdir(td) {
    if (dimmedTopdirs.has(td)) {
        dimmedTopdirs.delete(td);
    } else {
        dimmedTopdirs.add(td);
    }
    document.querySelectorAll(`[data-topdir="${td}"]`).forEach(el => el.classList.toggle("dimmed"));
    applyDim();
}
function applyDim() {
    const allDim = dimmedTopdirs.size === 0;
    node.transition().duration(300).style("opacity", n => {
        if (allDim) return 1;
        return dimmedTopdirs.has(n.topdir) ? 0.15 : 1;
    });
    label.transition().duration(300).style("opacity", n => {
        if (allDim) return 1;
        return dimmedTopdirs.has(n.topdir) ? 0.15 : 1;
    });
    link.transition().duration(300).style("opacity", e => {
        if (allDim) return 0.4;
        return (dimmedTopdirs.has(e.source.topdir) || dimmedTopdirs.has(e.target.topdir)) ? 0.05 : 0.4;
    });
}

function resetView() {
    svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
}
function releaseNodes() {
    nodes.forEach(n => { n.fx = null; n.fy = null; });
    simulation.alpha(0.5).restart();
}

simulation.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("cx", d => d.x).attr("cy", d => d.y);
    label.attr("x", d => d.x).attr("y", d => d.y);
});
</script>
