[project]
name = "dscr-loan-office"
version = "0.0.0"
description = "DSCR Sovereign OS / 20X DSCR Deal Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/dscr-core",
  "packages/evidence-vault",
  "packages/api",
]

[tool.uv.sources]
dscr-core = { workspace = true }
evidence-vault = { workspace = true }
api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
pythonpath = ["packages/dscr-core/src", "packages/evidence-vault/src", "packages/api/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true