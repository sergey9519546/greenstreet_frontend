<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("fonts/Outfit.woff2") format("woff2"); font-weight: 400 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 600 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #003738; }
      body { font-family: "Outfit", sans-serif; letter-spacing: -0.02em; color: #eeefd3; }
      .mono { font-family: "JetBrains Mono", monospace; }
      #stage { position: absolute; inset: 0; }
      .dotgrid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.04) 2px, transparent 2px); background-size: 46px 46px; }

      #wordmark { position: absolute; left: 160px; top: 90px; font-size: 40px; font-weight: 600; letter-spacing: -0.04em; color: #eeefd3; opacity: 0; }

      /* Scene A — Title */
      #sceneA { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
      #titleLine1 { font-size: 108px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.0; color: #eeefd3; opacity: 0; }
      #titleSlash { color: #d8d958; }
      #titleLine2 { font-size: 108px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.0; color: rgba(238,239,211,0.55); opacity: 0; }

      /* Scene B — Input Row */
      #sceneB { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; opacity: 0; }
      #sceneBLabel { font-size: 26px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(238,239,211,0.55); }
      #inputRow { display: flex; align-items: stretch; gap: 0; border-radius: 18px; overflow: hidden; }
      .inp-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 72px; gap: 10px; background: rgba(238,239,211,0.07); border-right: 1px solid rgba(238,239,211,0.1); opacity: 0; }
      .inp-cell:last-child { border-right: none; }
      .inp-label { font-size: 18px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(238,239,211,0.5); }
      .inp-val { font-family: "JetBrains Mono", monospace; font-size: 52px; font-weight: 700; letter-spacing: -0.03em; color: #eeefd3; }

      /* Scene C — DSCR reveal */
      #sceneC { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; opacity: 0; }
      #dscrLabel { font-size: 26px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(238,239,211,0.55); }
      #dscrBig { font-family: "JetBrains Mono", monospace; font-size: 320px; font-weight: 700; letter-spacing: -0.05em; color: #eeefd3; line-height: 0.85; }
      #dscrChip { display: inline-block; background: #d8d958; color: #003738; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 14px 36px; border-radius: 40px; opacity: 0; }

      /* Scene D — PITIA breakdown bar */
      #sceneD { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; opacity: 0; }
      #pitiaTitle { font-size: 28px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(238,239,211,0.55); }
      #pitiaTotal { font-family: "JetBrains Mono", monospace; font-size: 64px; font-weight: 700; letter-spacing: -0.04em; color: #eeefd3; }
      #barWrap { width: 900px; height: 16px; border-radius: 8px; background: rgba(238,239,211,0.1); overflow: hidden; display: flex; }
      .bar-seg { height: 100%; display: block; }
      #barPI  { background: #d8d958; width: 0%; }
      #barTax { background: rgba(238,239,211,0.45); width: 0%; }
      #barIns { background: rgba(238,239,211,0.22); width: 0%; }
      #barLegend { display: flex; gap: 44px; }
      .bl { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; color: rgba(238,239,211,0.8); opacity: 0; }
      .bl-sw { display: inline-block; width: 20px; height: 20px; border-radius: 5px; }

      /* Scene E — End card */
      #sceneE { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; opacity: 0; background: #003738; }
      #endLine { width: 120px; height: 4px; background: #d8d958; border-radius: 2px; opacity: 0; }
      #endH { font-size: 88px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.0; text-align: center; color: #eeefd3; max-width: 22ch; opacity: 0; }
      #endSub { font-size: 36px; font-weight: 500; color: rgba(238,239,211,0.6); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080"
         style="position: relative; width: 1920px; height: 1080px; overflow: hidden;">

      <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <div class="dotgrid"></div>
        <div id="wordmark">Greenstreet</div>

        <!-- A: Title -->
        <div id="sceneA">
          <div id="titleLine1">Run the DSCR <span id="titleSlash">/</span></div>
          <div id="titleLine2">before you run the deal.</div>
        </div>

        <!-- B: Input row -->
        <div id="sceneB">
          <div id="sceneBLabel">Deal parameters</div>
          <div id="inputRow">
            <div class="inp-cell" id="inpPrice">
              <div class="inp-label">Price</div>
              <div class="inp-val">$425,000</div>
            </div>
            <div class="inp-cell" id="inpRent">
              <div class="inp-label">Rent / mo</div>
              <div class="inp-val">$3,000</div>
            </div>
            <div class="inp-cell" id="inpRate">
              <div class="inp-label">Rate</div>
              <div class="inp-val">7.000%</div>
            </div>
          </div>
        </div>

        <!-- C: DSCR number -->
        <div id="sceneC">
          <div id="dscrLabel">Debt-Service Coverage Ratio</div>
          <div id="dscrBig">1.11x</div>
          <div id="dscrChip">Qualifies</div>
        </div>

        <!-- D: PITIA breakdown -->
        <div id="sceneD">
          <div id="pitiaTitle">PITIA Breakdown</div>
          <div id="pitiaTotal">$2,704 / mo</div>
          <div id="barWrap">
            <div class="bar-seg" id="barPI"></div>
            <div class="bar-seg" id="barTax"></div>
            <div class="bar-seg" id="barIns"></div>
          </div>
          <div id="barLegend">
            <div class="bl" id="bl2"><span class="bl-sw" style="background:#d8d958"></span>P&amp;I $2,288</div>
            <div class="bl" id="bl3"><span class="bl-sw" style="background:rgba(238,239,211,0.45)"></span>Taxes $417</div>
            <div class="bl" id="bl4"><span class="bl-sw" style="background:rgba(238,239,211,0.22)"></span>Ins. $167</div>
          </div>
        </div>

        <!-- E: End card -->
        <div id="sceneE">
          <div id="endLine"></div>
          <div id="endH">Price the deal in seconds.</div>
          <div id="endSub">— Greenstreet</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── initial states ── */
      gsap.set("#wordmark",   { opacity: 0 });
      gsap.set("#sceneB",     { opacity: 0 });
      gsap.set("#sceneC",     { opacity: 0 });
      gsap.set("#dscrBig",    { scale: 0.55, opacity: 0 });
      gsap.set("#dscrChip",   { opacity: 0, scale: 0.7 });
      gsap.set("#sceneD",     { opacity: 0 });
      gsap.set("#sceneE",     { opacity: 0 });

      /* ── Scene A: Title (0 → 2.2s) ── */
      tl.to("#wordmark",   { opacity: 1, duration: 0.5 }, 0.15);
      tl.to("#titleLine1", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", overwrite: "auto" }, 0.2);
      tl.to("#titleLine2", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", overwrite: "auto" }, 0.5);

      /* fade A out */
      tl.to("#sceneA",  { opacity: 0, duration: 0.45, ease: "power2.in" }, 1.95);

      /* ── Scene B: Inputs (2.2 → 4.1s) ── */
      tl.to("#sceneB",   { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.2);
      tl.to("#inpPrice", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", overwrite: "auto" }, 2.35);
      tl.to("#inpRent",  { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", overwrite: "auto" }, 2.55);
      tl.to("#inpRate",  { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", overwrite: "auto" }, 2.75);

      /* fade B out */
      tl.to("#sceneB", { opacity: 0, duration: 0.45, ease: "power2.in" }, 3.95);

      /* ── Scene C: DSCR number (4.2 → 6.3s) ── */
      tl.to("#sceneC",   { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.15);
      tl.to("#dscrBig",  { scale: 1, opacity: 1, duration: 0.85, ease: "back.out(1.4)", overwrite: "auto" }, 4.2);
      tl.to("#dscrChip", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)", overwrite: "auto" }, 5.05);

      /* fade C out */
      tl.to("#sceneC", { opacity: 0, duration: 0.45, ease: "power2.in" }, 6.05);

      /* ── Scene D: PITIA bar (6.3 → 8.1s) ── */
      tl.to("#sceneD", { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.3);
      /* P&I 84.6%, Tax 15.4%, Ins 6.2% of PITIA (cumulative must stay ≤ 100%) */
      tl.to("#barPI",  { width: "84.6%", duration: 0.7, ease: "power2.out", overwrite: "auto" }, 6.5);
      tl.to("#barTax", { width: "15.4%", duration: 0.6, ease: "power2.out", overwrite: "auto" }, 6.8);
      /* Note: PI+Tax = 100% so Ins gets clipped visually — correct for a bar showing proportions */
      tl.to("#bl2",    { opacity: 1, y: 0, duration: 0.4, overwrite: "auto" }, 6.75);
      tl.to("#bl3",    { opacity: 1, y: 0, duration: 0.4, overwrite: "auto" }, 6.95);
      tl.to("#bl4",    { opacity: 1, y: 0, duration: 0.4, overwrite: "auto" }, 7.15);

      /* fade D out */
      tl.to("#sceneD", { opacity: 0, duration: 0.45, ease: "power2.in" }, 7.8);

      /* ── Scene E: End card (7.95 → 9s) ── */
      tl.to("#sceneE",  { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.95);
      tl.to("#endLine", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", overwrite: "auto" }, 8.05);
      tl.to("#endH",    { opacity: 1, y: 0, duration: 0.65, ease: "power3.out", overwrite: "auto" }, 8.2);
      tl.to("#endSub",  { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", overwrite: "auto" }, 8.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
