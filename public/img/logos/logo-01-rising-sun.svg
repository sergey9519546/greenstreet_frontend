<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" role="img" aria-label="Apex Capital Funding">
  <title>Apex Capital Funding</title>
  <!-- Apex mark: rising A-peak over lemon horizon line -->
  <g transform="translate(6,8)">
    <rect width="52" height="52" rx="8" fill="#003738"/>
    <polygon points="26,10 44,42 8,42" fill="none" stroke="#d8d958" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="8" y1="42" x2="44" y2="42" stroke="#4dbd97" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="10" r="3" fill="#d8d958"/>
  </g>
  <g transform="translate(70,6)" font-family='"Outfit Variable",Outfit,Arial,sans-serif'>
    <text x="0" y="28" font-size="20" font-weight="700" letter-spacing="0.01em" fill="#003738">APEX CAPITAL</text>
    <text x="0" y="48" font-size="12" font-weight="500" letter-spacing="0.28em" fill="#006565">FUNDING</text>
  </g>
</svg>
