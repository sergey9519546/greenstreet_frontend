<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="Harbor Bridge Capital">
  <title>Harbor Bridge Capital</title>
  <!-- Bridge cable arc motif -->
  <g transform="translate(10,10)">
    <path d="M0 40 Q30 4 60 40" stroke="#003738" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M8 40 Q30 12 52 40" stroke="#006565" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M16 40 Q30 20 44 40" stroke="#4dbd97" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="60" y2="40" stroke="#d8d958" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="4" x2="30" y2="40" stroke="#003738" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <g transform="translate(88,8)" font-family='"Outfit Variable",Outfit,Arial,sans-serif'>
    <text x="0" y="30" font-size="22" font-weight="700" letter-spacing="0.02em" fill="#003738">HARBOR BRIDGE</text>
    <text x="0" y="52" font-size="11" font-weight="500" letter-spacing="0.32em" fill="#808285">CAPITAL</text>
  </g>
</svg>
