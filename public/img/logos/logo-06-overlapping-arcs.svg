<?xml version="1.0" encoding="UTF-8"?>
<!--
  Greenstreet themed logo — replacement for "overlapping arcs + bold uppercase" archetype.
  Layout: dynamic arc motif + heavy sans-serif uppercase wordmark.
  Theme palette: MIDNIGHT, PISTACHIO, MINT, LEMON, RAINFOREST, EMERALD.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Themed institutional logo 06">
  <title>Themed logo — overlapping arcs</title>
  <!-- overlapping arcs: rainforest + emerald + lemon -->
  <g transform="translate(12,4)">
    <path d="M0 36 A36 36 0 0 1 72 36" stroke="#003738" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M8 36 A28 28 0 0 1 64 36" stroke="#006565" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M16 36 A20 20 0 0 1 56 36" stroke="#4dbd97" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="36" cy="36" r="4" fill="#d8d958"/>
  </g>
  <g transform="translate(96,0)">
    <text x="0" y="36" font-family='"Outfit Variable", Outfit, Arial, sans-serif' font-size="26" font-weight="800" letter-spacing="0.02em" fill="#003738">ONYX BRIDGE</text>
    <text x="0" y="58" font-family='"Outfit Variable", Outfit, Arial, sans-serif' font-size="11" font-weight="500" letter-spacing="0.36em" fill="#808285">WEALTH GROUP</text>
  </g>
</svg>
