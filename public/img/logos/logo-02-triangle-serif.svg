<?xml version="1.0" encoding="UTF-8"?>
<!--
  Greenstreet themed logo — replacement for "split triangle + uppercase serif wordmark" archetype.
  Layout: geometric triangle mark + serif uppercase wordmark with wide-tracked subline.
  Theme palette: MIDNIGHT, PISTACHIO, MINT, LEMON, RAINFOREST, EMERALD.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Themed institutional logo 02">
  <title>Themed logo — split triangle serif</title>
  <!-- split triangle: emerald half + lemon half -->
  <g transform="translate(8,12)">
    <path d="M28 0 L56 56 L0 56 Z" fill="#4dbd97"/>
    <path d="M28 0 L56 56 L28 56 Z" fill="#d8d958"/>
  </g>
  <g transform="translate(80,0)" font-family='Georgia, "Times New Roman", serif'>
    <text x="0" y="38" font-size="22" font-weight="600" letter-spacing="0" fill="#003738">CHICAGO PARTNERS</text>
    <text x="0" y="62" font-size="12" font-weight="400" letter-spacing="0.36em" fill="#006565">WEALTH ADVISORS</text>
  </g>
</svg>
