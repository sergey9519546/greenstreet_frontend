<?xml version="1.0" encoding="UTF-8"?>
<!--
  Greenstreet themed logo — replacement for "compass/mountain icon + uppercase sans stacked" archetype.
  Layout: compass-rose icon + stacked uppercase sans-serif text.
  Theme palette: MIDNIGHT, PISTACHIO, MINT, LEMON, RAINFOREST, EMERALD.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Themed institutional logo 08">
  <title>Themed logo — compass mountain</title>
  <!-- compass: mountain peaks inside a midnight circle with emerald needle -->
  <g transform="translate(8,12)">
    <circle cx="28" cy="28" r="26" fill="#003738"/>
    <circle cx="28" cy="28" r="22" fill="none" stroke="#eeefd3" stroke-width="1"/>
    <path d="M16 38 L28 18 L36 30 L42 26 L42 38 Z" fill="#4dbd97"/>
    <path d="M16 38 L28 26 L36 32 L42 38 Z" fill="#006565"/>
    <polygon points="28,10 31,28 28,32 25,28" fill="#d8d958"/>
    <polygon points="28,46 25,28 28,24 31,28" fill="#eeefd3"/>
  </g>
  <g transform="translate(80,0)">
    <text x="0" y="34" font-family='"Outfit Variable", Outfit, Arial, sans-serif' font-size="20" font-weight="700" letter-spacing="0.04em" fill="#003738">SUMMIT GLOBAL</text>
    <text x="0" y="58" font-family='"Outfit Variable", Outfit, Arial, sans-serif' font-size="12" font-weight="500" letter-spacing="0.32em" fill="#006565">INVESTMENTS</text>
  </g>
</svg>
