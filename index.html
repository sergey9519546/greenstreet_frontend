<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenstreet Finance | The DSCR Engine for Non-QM Brokers</title>
    <meta name="description" content="Greenstreet Finance is the deterministic DSCR engine for non-QM brokers. Price rental deals in seconds, match 30+ lender programs, encode 50-state PPP rules." />

    <!-- Webflow stylesheet (restored — powers the original marketing visual) -->
    <link href="https://cdn.prod.website-files.com/67d0a8a9156b7b7bd46ffdfd/css/greenboard-00.shared.57c976e80.css" rel="stylesheet" type="text/css" />

    <!-- Fonts (same as before) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Critical inline styles that override Webflow defaults to match the
         Greenstreet DSCR color tokens. */
      body {
        overscroll-behavior-y: none;
        background-color: #EEEFD3;
        font-family: Outfit, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React app (handles all routes — Marketing route renders the Webflow HTML
         via dangerouslySetInnerHTML, other routes render React pages) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ───── Webflow scripts (restored) ───── -->
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=67d0a8a9156b7b7bd46ffdfd" crossorigin="anonymous"></script>
    <script src="https://cdn.prod.website-files.com/67d0a8a9156b7b7bd46ffdfd/js/greenboard-00.schunk.57706da51b32327c.js"></script>
    <script src="https://cdn.prod.website-files.com/67d0a8a9156b7b7bd46ffdfd/js/greenboard-00.0d162371.8614de198f9d7870.js"></script>

    <script src="https://cdn.prod.website-files.com/gsap/3.15.0/gsap.min.js"></script>
    <script src="https://cdn.prod.website-files.com/gsap/3.15.0/ScrollTrigger.min.js"></script>
    <script src="https://cdn.prod.website-files.com/gsap/3.15.0/Observer.min.js"></script>
    <script src="https://cdn.prod.website-files.com/gsap/3.15.0/Flip.min.js"></script>
    <script type="text/javascript">gsap.registerPlugin(ScrollTrigger, Observer, Flip);</script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script type="text/javascript" src="https://static.hsappstatic.net/MeetingsEmbed/ex/MeetingsEmbedCode.js"></script>

    <!-- ───── Webflow init script (wraps the original GSAP setup so it can be
         re-fired when the marketing route remounts after navigation) ───── -->
    <script>
      function initAnimations() {
        if (typeof gsap === "undefined") return;
        gsap.registerPlugin(ScrollTrigger);
        let lenis;
        let showAnim;
        let mm = gsap.matchMedia();
        function isSafari() {
          return /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        }

        // Desktop Only — navbar button reveal on scroll
        mm.add("(min-width: 992px)", () => {
          gsap.set(".nav-btn", { minWidth: "0rem" });
          let tlNavbar = gsap.timeline({
            paused: true,
            defaults: { ease: "power3.out" },
          });
          tlNavbar.to(".nav-btn", { minWidth: "14rem", duration: 0.55 });
          ScrollTrigger.create({
            trigger: "body",
            start: "top+=75 top",
            onEnter: () => tlNavbar.play(),
            onLeaveBack: () => {
              gsap.to(".nav-btn .btn_main_wrap", { opacity: 0, duration: 0.15 });
              gsap.to(".nav-btn", {
                minWidth: "0rem",
                duration: 0.55,
                ease: "power3.out",
                onComplete: () => {
                  gsap.set(".nav-btn .btn_main_wrap", { opacity: 1 });
                  tlNavbar.pause(0);
                },
              });
            },
          });
        });

        // Mobile menu toggle
        let menuClick = true;
        let menuMobiletl = gsap.timeline({
          paused: true,
          defaults: { duration: 0.4, ease: "power4.inOut" },
        });
        menuMobiletl
          .to(".burger-line.middle", {
            marginTop: "calc(0rem - 1px)",
            marginBottom: "calc(0rem - 1px)",
          })
          .set(".burger-line.middle", { opacity: 0, duration: 0.2 }, "<0.2")
          .to(".burger-line.top", { rotate: "45deg" }, "<")
          .to(".burger-line.bottom", { rotate: "-45deg" }, "<")
          .set(".menu-mobile-wrap", { display: "flex" }, "<")
          .from(".menu-mobile-wrap", { opacity: 0, duration: 0.2 }, "<0.1");

        if (window.jQuery) {
          const $ = window.jQuery;
          $(".burger-wrap").on("click", function () {
            if (menuClick) { menuMobiletl.play(); menuClick = false; }
            else { menuMobiletl.reverse(); menuClick = true; }
          });

          $('[class*="drawer-top"], [drawer-top]').on("click", function () {
            var $element = $(this).closest(".drawer-item, [drawer-parent]");
            var clickCount = $element.data("clickCount") || 0;
            if (clickCount === 1) {
              $element.removeClass("open");
              setTimeout(function () { ScrollTrigger.refresh(); }, 600);
            } else {
              $element.siblings().removeClass("open").data("clickCount", 0);
              $element.addClass("open");
              setTimeout(function () { ScrollTrigger.refresh(); }, 600);
            }
            clickCount++;
            if (clickCount > 1) clickCount = 0;
            $element.data("clickCount", clickCount);
          });

          // Swiper
          $(".swiper").each(function () {
            let $swiper = $(this);
            let prev = $swiper.find(".is-prev")[0];
            let next = $swiper.find(".is-next")[0];
            let nav = $swiper.find(".swiper-pagination")[0];
            if (!prev || !next || !nav) {
              let $wrap = $swiper.closest(".home-swiper-wrap");
              if ($wrap.length) {
                prev = prev || $wrap.find(".is-prev")[0];
                next = next || $wrap.find(".is-next")[0];
                nav = nav || $wrap.find(".swiper-pagination")[0];
              }
            }
            if ($swiper.find("div.w-dyn-empty").length) return;
            let loop = $swiper.data("loop") === true;
            let centered = $swiper.data("centered") === true;
            let autoplay = $swiper.data("autoplay") === true;
            let speed = $swiper.data("speed") || 600;
            let delay = $swiper.data("delay") || 5000;
            new Swiper($swiper.find(".swiper-container")[0], {
              grabCursor: true,
              speed: speed,
              loop: loop,
              autoplay: autoplay ? { delay: delay } : false,
              centeredSlides: centered,
              slidesPerView: "auto",
              slidesPerGroup: 1,
              navigation: { nextEl: next, prevEl: prev },
              pagination: { el: nav, clickable: true },
            });
          });
        }

        // Refresh ScrollTrigger after a tick so it sees the new DOM
        setTimeout(() => { try { ScrollTrigger.refresh(); } catch (e) {} }, 100);
      }

      // Re-fire initAnimations after React has mounted the marketing HTML.
      // The React MarketingSite component also calls this directly on mount.
      window.addEventListener("load", () => { setTimeout(initAnimations, 500); });
    </script>
  </body>
</html>
