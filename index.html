<script>
      // Shared lifecycle registry for the embedded marketing scripts so React
      // can tear them down when leaving the marketing view (see __gsStopMarketing).
      window.__gsMkt = window.__gsMkt || { started: false, swipers: [], intervals: [] };
      function initAnimations() {
        if (typeof gsap === "undefined") return;
        window.__gsMkt = window.__gsMkt || { started: false, swipers: [], intervals: [] };
        gsap.registerPlugin(ScrollTrigger);
        let lenis;
        let showAnim;
        let mm = gsap.matchMedia();
        function isSafari() {
          return /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        }

        // Desktop Only — navbar button reveal on scroll
        mm.add("(min-width: 992px)", () => {
          gsap.set(".nav-btn", { minWidth: "0rem" });
          let tlNavbar = gsap.timeline({
            paused: true,
            defaults: { ease: "power3.out" },
          });
          tlNavbar.to(".nav-btn", { minWidth: "14rem", duration: 0.55 });
          ScrollTrigger.create({
            trigger: "body",
            start: "top+=75 top",
            onEnter: () => tlNavbar.play(),
            onLeaveBack: () => {
              gsap.to(".nav-btn .btn_main_wrap", { opacity: 0, duration: 0.15 });
              gsap.to(".nav-btn", {
                minWidth: "0rem",
                duration: 0.55,
                ease: "power3.out",
                onComplete: () => {
                  gsap.set(".nav-btn .btn_main_wrap", { opacity: 1 });
                  tlNavbar.pause(0);
                },
              });
            },
          });
        });

        // Mobile menu toggle
        let menuClick = true;
        let menuMobiletl = gsap.timeline({
          paused: true,
          defaults: { duration: 0.4, ease: "power4.inOut" },
        });
        menuMobiletl
          .to(".burger-line.middle", {
            marginTop: "calc(0rem - 1px)",
            marginBottom: "calc(0rem - 1px)",
          })
          .set(".burger-line.middle", { opacity: 0, duration: 0.2 }, "<0.2")
          .to(".burger-line.top", { rotate: "45deg" }, "<")
          .to(".burger-line.bottom", { rotate: "-45deg" }, "<")
          .set(".menu-mobile-wrap", { display: "flex" }, "<")
          .from(".menu-mobile-wrap", { opacity: 0, duration: 0.2 }, "<0.1");

        if (window.jQuery) {
          const $ = window.jQuery;
          $(".burger-wrap").on("click", function () {
            if (menuClick) { menuMobiletl.play(); menuClick = false; }
            else { menuMobiletl.reverse(); menuClick = true; }
          });

          $('[class*="drawer-top"], [drawer-top]').on("click", function () {
            var $element = $(this).closest(".drawer-item, [drawer-parent]");
            var clickCount = $element.data("clickCount") || 0;
            if (clickCount === 1) {
              $element.removeClass("open");
              setTimeout(function () { ScrollTrigger.refresh(); }, 600);
            } else {
              $element.siblings().removeClass("open").data("clickCount", 0);
              $element.addClass("open");
              setTimeout(function () { ScrollTrigger.refresh(); }, 600);
            }
            clickCount++;
            if (clickCount > 1) clickCount = 0;
            $element.data("clickCount", clickCount);
          });

          // Swiper
          $(".swiper").each(function () {
            let $swiper = $(this);
            let prev = $swiper.find(".is-prev")[0];
            let next = $swiper.find(".is-next")[0];
            let nav = $swiper.find(".swiper-pagination")[0];
            if (!prev || !next || !nav) {
              let $wrap = $swiper.closest(".home-swiper-wrap");
              if ($wrap.length) {
                prev = prev || $wrap.find(".is-prev")[0];
                next = next || $wrap.find(".is-next")[0];
                nav = nav || $wrap.find(".swiper-pagination")[0];
              }
            }
            if ($swiper.find("div.w-dyn-empty").length) return;
            let loop = $swiper.data("loop") === true;
            let centered = $swiper.data("centered") === true;
            let autoplay = $swiper.data("autoplay") === true;
            let speed = $swiper.data("speed") || 600;
            let delay = $swiper.data("delay") || 5000;
            window.__gsMkt.swipers.push(new Swiper($swiper.find(".swiper-container")[0], {
              grabCursor: true,
              speed: speed,
              loop: loop,
              autoplay: autoplay ? { delay: delay } : false,
              centeredSlides: centered,
              slidesPerView: "auto",
              slidesPerGroup: 1,
              navigation: { nextEl: next, prevEl: prev },
              pagination: { el: nav, clickable: true },
            }));
          });
        }

        // Refresh ScrollTrigger after a tick so it sees the new DOM
        setTimeout(() => { try { ScrollTrigger.refresh(); } catch (e) {} }, 100);
      }

      // Re-fire initAnimations after React has mounted the marketing HTML —
      // ONLY on the marketing route. On React (non-marketing) routes the
      // marketing DOM is hidden, so binding GSAP/Swiper/ScrollTrigger there is
      // pure pollution: it floods the console and hijacks scroll/history.
      // React drives marketing init/teardown via __gsStartMarketing/__gsStopMarketing.
      window.addEventListener("load", () => {
        if (location.pathname === "/" || location.pathname === "") {
          setTimeout(initAnimations, 500);
        }
      });
    </script>

// ── Marketing lifecycle controller ──────────────────────────────────────────
// allpages()/socialShare()/initFeatureLayouts() used to run unconditionally on
// EVERY route, binding GSAP/Swiper/jQuery handlers (incl. a book-demo handler
// that does window.location.href) against the hidden Webflow marketing DOM on
// React pages — hijacking scroll/history and flooding the console (QA item V8).
// They now run only on the marketing route; React starts/stops them per view.
window.__gsMkt = window.__gsMkt || { started: false, swipers: [], intervals: [] };
function __gsStartMarketing() {
  if (window.__gsMkt.started) return;
  window.__gsMkt.started = true;
  try { allpages(); } catch (e) { console.error("allpages failed:", e); }
  try { socialShare(); } catch (e) { console.error("socialShare failed:", e); }
  try { initFeatureLayouts(); } catch (e) { console.error("initFeatureLayouts failed:", e); }
}
function __gsStopMarketing() {
  window.__gsMkt.started = false;
  try { if (window.ScrollTrigger) window.ScrollTrigger.getAll().forEach(function (t) { t.kill(); }); } catch (e) {}
  try {
    window.__gsMkt.swipers.forEach(function (s) {
      try { if (s && s.autoplay) s.autoplay.stop(); if (s && s.destroy) s.destroy(true, true); } catch (e) {}
    });
  } catch (e) {}
  window.__gsMkt.swipers = [];
  try { window.__gsMkt.intervals.forEach(function (id) { clearInterval(id); }); } catch (e) {}
  window.__gsMkt.intervals = [];
  try { if (window.jQuery) window.jQuery('a[href*="book-demo"], a[href*="book-a-demo"]').off('click.gsmkt'); } catch (e) {}
}
window.__gsStartMarketing = __gsStartMarketing;
window.__gsStopMarketing = __gsStopMarketing;
if (location.pathname === "/" || location.pathname === "") {
  __gsStartMarketing();
} else {
  // Direct load on a React route: kill any ScrollTrigger the top-level matchMedia
  // block registered at parse so it can't interfere with SPA routing.
  __gsStopMarketing();
}

<script>
(function () {
  // Marketing-only popup. Gated to the marketing route so its history.pushState
  // / popstate listener can't interfere with React SPA routing, and null-guarded
  // so it never throws when the popup markup isn't present.
  if (location.pathname !== "/" && location.pathname !== "") return;
  const popup = document.querySelector('.soa-form-popup');
  if (!popup) return;
  const bg = popup.querySelector('.form-poopup-bk');
  const content = popup.querySelector('.form-popup-content');
  const triggers = document.querySelectorAll('[data-open-soa]');
  if (!bg || !content) return;

  const tl = gsap.timeline({
    paused: true,
    onStart: () => popup.style.display = 'block',
    onReverseComplete: () => popup.style.display = 'none'
  });

  tl.from(bg, { autoAlpha: 0, duration: 0.4, ease: 'power2.out' })
    .from(content, { autoAlpha: 0, y: 40, duration: 0.5, ease: 'power3.out' }, '-=0.2');

  const open = () => {
    history.pushState({ soa: true }, '');
    tl.play();
  };

  const close = () => {
    if (history.state?.soa) history.back();
    else tl.reverse();
  };

  triggers.forEach(t => t.addEventListener('click', e => {
    e.preventDefault();
    open();
  }));

  bg.addEventListener('click', close);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && tl.progress() > 0) close();
  });

  window.addEventListener('popstate', () => tl.reverse());
})();
</script>
