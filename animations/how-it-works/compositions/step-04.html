<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #EEEFD3; font-family: "Outfit", sans-serif; }
      #root { width: 1920px; height: 1080px; position: relative; }
      
      .title {
        font-size: 80px;
        color: #003738;
        font-weight: 700;
        position: absolute;
        top: 150px;
        left: 0;
        width: 1920px;
        text-align: center;
        letter-spacing: -0.03em;
      }
      .accent { color: #006565; }

      .map-container {
        position: absolute;
        top: 350px;
        left: 460px;
        width: 1000px;
        height: 600px;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="600" fill="%23D7EBE1" rx="40"/><path d="M100 100 h800 v400 h-800 z" fill="%23fff" opacity="0.5"/></svg>') no-repeat center;
        border-radius: 40px;
        box-shadow: 0 20px 40px rgba(0,55,56,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.9);
      }

      .rules-ticker {
        position: absolute;
        top: 200px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .rule-item {
        background: #003738;
        color: #EEEFD3;
        padding: 20px 40px;
        border-radius: 100px;
        font-size: 24px;
        font-weight: 600;
        box-shadow: 0 10px 20px rgba(0,55,56,0.1);
        display: inline-flex;
        align-items: center;
        gap: 16px;
        position: absolute;
        opacity: 0;
        white-space: nowrap;
      }
      
      .rule-item .state-badge {
        background: #D8D958;
        color: #003738;
        padding: 4px 12px;
        border-radius: 8px;
        font-weight: 700;
      }

      #r1 { left: 500px; top: 100px; }
      #r2 { left: 700px; top: 200px; }
      #r3 { left: 400px; top: 300px; }
      #r4 { left: 600px; top: 400px; }

      .central-shield {
        position: absolute;
        width: 160px;
        height: 160px;
        background: #006565;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 8px solid #EEEFD3;
        box-shadow: 0 20px 40px rgba(0,55,56,0.2);
        z-index: 10;
        top: 220px;
        left: 420px;
        color: #D8D958;
        font-size: 64px;
        opacity: 0;
        transform: scale(0);
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="step-04" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="title" class="title">50-state rules, <span class="accent">always current</span></div>

      <div class="map-container" id="map">
        <div class="central-shield" id="shield">✓</div>
        
        <div class="rule-item" id="r1"><div class="state-badge">TX</div> APR ban enforced</div>
        <div class="rule-item" id="r2"><div class="state-badge">MN</div> HF 3437 compliant</div>
        <div class="rule-item" id="r3"><div class="state-badge">NJ</div> LLC risk mitigated</div>
        <div class="rule-item" id="r4"><div class="state-badge">PA</div> Threshold verified</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.to("#title", { opacity: 1, y: 30, duration: 1, ease: "power3.out" }, 0.2);
      
      // Reveal map
      tl.to("#map", { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.5);

      // Pop in shield
      tl.to("#shield", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 1.0);

      // Pop rules
      tl.to("#r1", { opacity: 1, y: -20, duration: 0.5, ease: "power2.out" }, 1.5);
      tl.to("#r2", { opacity: 1, y: -20, duration: 0.5, ease: "power2.out" }, 1.8);
      tl.to("#r3", { opacity: 1, y: -20, duration: 0.5, ease: "power2.out" }, 2.1);
      tl.to("#r4", { opacity: 1, y: -20, duration: 0.5, ease: "power2.out" }, 2.4);

      // Floating effect
      tl.to([".rule-item", "#shield"], { y: "-=10", duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut", stagger: 0.2 }, 2.5);

      // Outro
      tl.to(["#title", "#map"], { opacity: 0, y: -50, duration: 0.8, stagger: 0.1, ease: "power3.in" }, 5.0);

      window.__timelines["step-04"] = tl;
    </script>
  </body>
</html>
