<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #EEEFD3; font-family: "Outfit", sans-serif; }
      #root { width: 1920px; height: 1080px; position: relative; }
      .bg-circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; }
      .c1 { width: 800px; height: 800px; background: #D8D958; top: -200px; left: -200px; }
      .c2 { width: 900px; height: 900px; background: #006565; bottom: -300px; right: -200px; }
      
      .title {
        font-size: 80px;
        color: #003738;
        font-weight: 700;
        position: absolute;
        top: 150px;
        left: 0;
        width: 1920px;
        text-align: center;
        letter-spacing: -0.03em;
      }
      .accent { color: #006565; }

      .ui-card {
        position: absolute;
        width: 600px;
        background: #FFFFFF;
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(0,55,56,0.1);
        left: 660px;
        top: 350px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .field {
        height: 60px;
        background: #f4f5f5;
        border-radius: 12px;
        border: 2px solid #e0e0e0;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 24px;
        color: #003738;
        font-weight: 600;
        position: relative;
        overflow: hidden;
      }

      .cursor {
        position: absolute;
        width: 3px;
        height: 30px;
        background: #006565;
        left: 20px;
        animation: blink 1s infinite;
      }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      .calc-btn {
        height: 70px;
        background: #003738;
        color: #EEEFD3;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        margin-top: 20px;
      }

      .result-card {
        position: absolute;
        width: 400px;
        background: #006565;
        color: #EEEFD3;
        border-radius: 24px;
        left: 1000px;
        top: 500px;
        padding: 40px;
        box-shadow: 0 40px 80px rgba(0,55,56,0.2);
        z-index: 10;
      }

      .dscr-label { font-size: 24px; font-weight: 600; opacity: 0.8; }
      .dscr-val { font-size: 80px; font-weight: 700; margin-top: 10px; color: #D8D958; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="step-01" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="bg-circle c1"></div>
      <div class="bg-circle c2"></div>
      
      <div id="title" class="title">Price the deal in <span class="accent">seconds</span></div>

      <div id="ui-card" class="ui-card">
        <div class="field" id="f1"><div class="cursor" id="c1"></div><span id="t1"></span></div>
        <div class="field" id="f2"><div class="cursor" id="c2" style="display:none;"></div><span id="t2"></span></div>
        <div class="field" id="f3"><div class="cursor" id="c3" style="display:none;"></div><span id="t3"></span></div>
        <div class="calc-btn" id="btn">Calculate DSCR</div>
      </div>

      <div id="result" class="result-card">
        <div class="dscr-label">Track 1 DSCR</div>
        <div class="dscr-val">1.25x</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Initial state
      gsap.set(["#title", "#ui-card", "#result"], { opacity: 0 });
      gsap.set("#result", { scale: 0.8, x: -50 });
      gsap.set(".c1", { x: -100 });
      gsap.set(".c2", { x: 100 });

      // Animate backgrounds
      tl.to(".c1", { x: 0, duration: 6, ease: "none" }, 0);
      tl.to(".c2", { x: 0, duration: 6, ease: "none" }, 0);

      // Intro
      tl.to("#title", { opacity: 1, y: 30, duration: 1, ease: "power3.out" }, 0.2);
      tl.to("#ui-card", { opacity: 1, y: -20, duration: 1, ease: "back.out(1.2)" }, 0.5);

      // Typing simulation
      const typeText = (id, text, time) => {
        tl.to(id, { textContent: text, duration: 0.5, ease: "none" }, time);
      };

      // F1 typing
      tl.to("#c1", { left: 320, duration: 0.5 }, 1.0);
      tl.to("#t1", { innerHTML: "123 Main St, Austin TX", duration: 0.5 }, 1.0);
      
      // F2 typing
      tl.set("#c1", { display: "none" }, 1.6);
      tl.set("#c2", { display: "block" }, 1.6);
      tl.to("#c2", { left: 160, duration: 0.4 }, 1.7);
      tl.to("#t2", { innerHTML: "$3,500/mo", duration: 0.4 }, 1.7);

      // F3 typing
      tl.set("#c2", { display: "none" }, 2.2);
      tl.set("#c3", { display: "block" }, 2.2);
      tl.to("#c3", { left: 100, duration: 0.3 }, 2.3);
      tl.to("#t3", { innerHTML: "7.25%", duration: 0.3 }, 2.3);
      tl.set("#c3", { display: "none" }, 2.7);

      // Button click
      tl.to("#btn", { scale: 0.95, background: "#006565", duration: 0.1 }, 3.0);
      tl.to("#btn", { scale: 1, duration: 0.1 }, 3.1);

      // Result reveal
      tl.to("#result", { opacity: 1, scale: 1, x: 0, duration: 0.8, ease: "elastic.out(1, 0.7)" }, 3.3);

      // Outro
      tl.to(["#title", "#ui-card", "#result"], { opacity: 0, y: -50, duration: 0.8, stagger: 0.1, ease: "power3.in" }, 5.0);

      window.__timelines["step-01"] = tl;
    </script>
  </body>
</html>
