<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #006565; font-family: "Outfit", sans-serif; }
      #root { width: 1920px; height: 1080px; position: relative; }
      
      .title {
        font-size: 80px;
        color: #EEEFD3;
        font-weight: 700;
        position: absolute;
        top: 150px;
        left: 0;
        width: 1920px;
        text-align: center;
        letter-spacing: -0.03em;
      }
      .accent { color: #D8D958; }

      .file-stack {
        position: absolute;
        top: 400px;
        left: 760px;
        width: 400px;
        height: 400px;
      }

      .file {
        position: absolute;
        width: 100%;
        height: 120px;
        background: #FFFFFF;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(0,55,56,0.2);
        display: flex;
        align-items: center;
        padding: 0 30px;
        gap: 20px;
        opacity: 0;
      }

      .f-icon { width: 60px; height: 60px; background: #D7EBE1; border-radius: 12px; }
      .f-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; }
      .f-line-1 { height: 12px; width: 60%; background: #e0e0e0; border-radius: 6px; }
      .f-line-2 { height: 12px; width: 40%; background: #f0f0f0; border-radius: 6px; }

      #f1 { top: 0px; z-index: 3; }
      #f2 { top: 30px; z-index: 2; transform: scale(0.95); opacity: 0; }
      #f3 { top: 60px; z-index: 1; transform: scale(0.9); opacity: 0; }

      .folder {
        position: absolute;
        top: 350px;
        left: 660px;
        width: 600px;
        height: 400px;
        background: #D8D958;
        border-radius: 24px 24px 0 0;
        transform-origin: bottom center;
        opacity: 0;
        box-shadow: 0 40px 80px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      
      .folder-front {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 250px;
        background: #c7c845;
        border-radius: 24px;
        z-index: 10;
      }
      
      .status {
        position: absolute;
        bottom: -60px;
        left: 50%;
        transform: translateX(-50%);
        background: #003738;
        color: #D8D958;
        padding: 16px 40px;
        border-radius: 100px;
        font-size: 32px;
        font-weight: 700;
        opacity: 0;
        z-index: 20;
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="step-05" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="title" class="title">Submit clean. <span class="accent">Close fast.</span></div>

      <div class="folder" id="folder">
        <div class="folder-front"></div>
        <div class="status" id="status">CLEAN FILE</div>
      </div>

      <div class="file-stack">
        <div class="file" id="f3"><div class="f-icon"></div><div class="f-lines"><div class="f-line-1"></div><div class="f-line-2"></div></div></div>
        <div class="file" id="f2"><div class="f-icon"></div><div class="f-lines"><div class="f-line-1"></div><div class="f-line-2"></div></div></div>
        <div class="file" id="f1"><div class="f-icon"></div><div class="f-lines"><div class="f-line-1"></div><div class="f-line-2"></div></div></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.to("#title", { opacity: 1, y: 30, duration: 1, ease: "power3.out" }, 0.2);
      
      // Reveal folder
      tl.to("#folder", { opacity: 1, y: -20, duration: 0.8, ease: "power2.out" }, 0.5);

      // Drop files into folder
      tl.fromTo("#f1", { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out" }, 1.0);
      tl.fromTo("#f2", { y: -200, opacity: 0 }, { y: 30, opacity: 1, duration: 0.5, ease: "bounce.out" }, 1.3);
      tl.fromTo("#f3", { y: -200, opacity: 0 }, { y: 60, opacity: 1, duration: 0.5, ease: "bounce.out" }, 1.6);

      // Slide files down into folder
      tl.to(["#f1", "#f2", "#f3"], { y: "+=150", opacity: 0, duration: 0.5, stagger: 0.1, ease: "power2.in" }, 2.5);

      // Show status
      tl.to("#status", { opacity: 1, y: -20, duration: 0.5, ease: "back.out(1.5)" }, 3.0);

      // Close folder
      tl.to("#folder", { scaleY: 0.9, duration: 0.2, yoyo: true, repeat: 1 }, 3.5);

      // Outro
      tl.to(["#title", "#folder"], { opacity: 0, y: -50, duration: 0.8, stagger: 0.1, ease: "power3.in" }, 5.0);

      window.__timelines["step-05"] = tl;
    </script>
  </body>
</html>
